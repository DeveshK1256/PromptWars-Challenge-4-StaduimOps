name: Deploy to Google Cloud

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  API_SERVICE: stadium-ops-api
  REGISTRY: gcr.io

jobs:
  # ── Quality Gates ─────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

      - name: Security Audit
        run: npm audit --audit-level=high || true

  # ── Build & Push Docker Image ─────────────────────────────
  build-api:
    name: Build API Container
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker

      - name: Build & Push
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$API_SERVICE:${{ github.sha }} .
          docker build -t $REGISTRY/$PROJECT_ID/$API_SERVICE:latest .
          docker push $REGISTRY/$PROJECT_ID/$API_SERVICE:${{ github.sha }}
          docker push $REGISTRY/$PROJECT_ID/$API_SERVICE:latest

  # ── Deploy to Cloud Run ───────────────────────────────────
  deploy-api:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest
    needs: build-api
    environment: production

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.API_SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}

      - name: Smoke Test
        run: |
          URL=$(gcloud run services describe $API_SERVICE --region $REGION --format 'value(status.url)')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: /health returned $STATUS"
            exit 1
          fi
          echo "✅ Smoke test passed — API healthy at $URL"

  # ── Deploy Frontend to Firebase Hosting ───────────────────
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
