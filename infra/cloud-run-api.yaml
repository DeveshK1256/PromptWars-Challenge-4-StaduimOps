apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stadium-ops-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/stadium-ops-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Persistence__Provider
              value: SqlServer
            - name: VertexAI__Location
              value: us-central1
