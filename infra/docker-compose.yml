services:
  api:
    build:
      context: ..
      dockerfile: src/StadiumOps.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Development
      Persistence__Provider: InMemory
      Jwt__Issuer: stadium-ops-dev
      Jwt__Audience: stadium-ops-web
      Jwt__SigningKey: development-only-change-this-key-before-production-32chars-minimum
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5000:8080"
